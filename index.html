<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Test Firestore</title>
</head>
<body>
  <h2>🔥 Test de connexion à Firestore</h2>
  <p id="result">Chargement...</p>

  <!-- Import Firebase -->
  <script type="module">
    // Import des SDK Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ⚙️ Configuration de ton projet Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDbrBWy7hHQEelg1k5Dqdi14CQ9T4yYd00",
      authDomain: "lossa-b3-11.firebaseapp.com",
      projectId: "lossa-b3-11",
      storageBucket: "lossa-b3-11.appspot.com",
      messagingSenderId: "691043768338",
      appId: "1:691043768338:web:631377e231f179a116d268"
    };

    // Initialisation
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const result = document.getElementById("result");

    async function testFirestore() {
      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        if (querySnapshot.empty) {
          result.textContent = "✅ Connexion réussie, mais la collection 'users' est vide.";
        } else {
          let dataList = [];
          querySnapshot.forEach(doc => {
            dataList.push(`${doc.id}: ${JSON.stringify(doc.data())}`);
          });
          result.innerHTML = "<b>✅ Connexion réussie !</b><br><br>" + dataList.join("<br>");
        }
      } catch (error) {
        console.error(error);
        result.innerHTML = `<b>❌ Erreur :</b> ${error.message}`;
      }
    }

    testFirestore();
  </script>
</body>
</html>
